<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nikel Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            max-width: 350px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
        }
        .num {
            aspect-ratio: 1;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        .num.clicked {
            background: #f39c12;
            color: black;
        }
        .btn {
            background: #f39c12;
            border: none;
            padding: 15px 30px;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>NIKEL BINGO 🎰</h2>
    <div class="card" id="bingoGrid"></div>
    <button class="btn" onclick="window.location.reload()">አዲስ ካርድ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // ሚኒ አፑን ወደ ላይ ከፍ እንዲል ያደርገዋል

        const grid = document.getElementById('bingoGrid');
        let nums = [];
        while(nums.length < 25) {
            let r = Math.floor(Math.random() * 75) + 1;
            if(nums.indexOf(r) === -1) nums.push(r);
        }

        nums.forEach(n => {
            let d = document.createElement('div');
            d.className = 'num';
            d.innerText = n;
            d.onclick = function() {
                this.classList.toggle('clicked');
                if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            };
            grid.appendChild(d);
        });
    </script>
</body>
</html>
