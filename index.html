<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Pro</title>
    <style>
        :root { --main-bg: #1a0b38; --card-bg: #2d1b5a; --accent: #f39c12; --win: #2ecc71; --blue: #3498db; }
        body { font-family: sans-serif; background: var(--main-bg); color: white; margin: 0; height: 100vh; overflow: hidden; }
        
        /* 1-200 Selection Section */
        #selection-view { padding: 15px; text-align: center; height: 100%; overflow-y: auto; }
        .scroll-container { 
            max-height: 380px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.4); 
            padding: 10px; 
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            margin: 0 auto;
            max-width: 350px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .num-btn { background: #333; border: none; color: white; padding: 10px 2px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .num-btn.selected { background: var(--accent); transform: scale(1.1); }

        /* Game Layout Section */
        #game-view { display: none; height: 100%; grid-template-columns: 110px 1fr; }
        
        /* Left Side Board */
        .side-board { background: rgba(0,0,0,0.5); border-right: 1px solid #444; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; padding: 2px; }
        .board-col { display: flex; flex-direction: column; gap: 1px; }
        .b-head { background: var(--blue); text-align: center; font-size: 10px; font-weight: bold; padding: 6px 0; }
        .b-num { background: #222; font-size: 9px; text-align: center; padding: 5px 0; color: #aaa; }
        .b-called { background: var(--accent) !important; color: white; font-weight: bold; }

        /* Play Area */
        .play-area { padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .caller-circle { width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--accent); background: white; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 25px; box-shadow: 0 0 15px rgba(243, 156, 18, 0.4); }
        
        /* Bingo Card */
        .bingo-card-box { background: var(--card-bg); padding: 20px 12px; border-radius: 15px; width: 92%; max-width: 290px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
        .bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; margin-bottom: 8px; color: var(--blue); font-size: 18px; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: white; color: black; text-align: center; padding: 12px 0; font-weight: bold; border-radius: 4px; font-size: 15px; transition: 0.3s; }
        .marked { background: var(--win) !important; color: white; transform: scale(0.95); }
        
        .timer-text { color: var(--accent); font-size: 18px; font-weight: bold; margin: 15px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 1. Selection Screen -->
    <div id="selection-view">
        <h3 style="color:var(--accent); margin-bottom: 15px;">ቁጥር ይምረጡ (1-200)</h3>
        <div class="scroll-container" id="grid-200"></div>
        
        <div id="prep-area" class="hidden">
            <p id="timer-display" class="timer-text"></p>
            <div class="bingo-card-box" style="margin: 0 auto;">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="preview-card"></div>
            </div>
        </div>
    </div>

    <!-- 2. Active Game Screen -->
    <div id="game-view">
        <!-- Left Sidebar Board -->
        <div class="side-board" id="side-board"></div>

        <!-- Main Play Area -->
        <div class="play-area">
            <div class="caller-circle">
                <span id="call-l" style="font-size:14px">START</span>
                <span id="call-n" style="font-size:26px">--</span>
            </div>
            
            <div class="bingo-card-box">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="active-card"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B', 'I', 'N', 'G', 'O'];
        const ranges = [[1,15], [16,30], [31,45], [46,60], [61,75]];
        let myCardNumbers = [];

        // Create 1-200 Grid
        const gridContainer = document.getElementById('grid-200');
        for(let i=1; i<=200; i++){
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => selectNumber(i, btn);
            gridContainer.appendChild(btn);
        }

        function selectNumber(num, btn) {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('prep-area').classList.remove('hidden');
            
            generateBingoCard('preview-card');
            startCountdown(30);
        }

        function generateBingoCard(targetId) {
            const container = document.getElementById(targetId);
            container.innerHTML = "";
            let cardCols = [];

            for(let i=0; i<5; i++){
                let col = [];
                while(col.length < 5){
                    let r = Math.floor(Math.random()*(ranges[i][1]-ranges[i][0]+1))+ranges[i][0];
                    if(!col.includes(r)) col.push(r);
                }
                cardCols.push(col);
            }

            for(let r=0; r<5; r++){
                for(let c=0; c<5; c++){
                    let val = (r===2 && c===2) ? "FREE" : cardCols[c][r];
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = val;
                    cell.dataset.val = val;
                    container.appendChild(cell);
                }
            }
        }

        function startCountdown(seconds) {
            let timeLeft = seconds;
            const display = document.getElementById('timer-display');
            let timer = setInterval(() => {
                timeLeft--;
                display.innerText = `ጨዋታው ለመጀመር ${timeLeft} ሰከንድ...`;
                if(timeLeft <= 0){
                    clearInterval(timer);
                    launchGame();
                }
            }, 1000);
        }

        function launchGame() {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'grid';
            
            // Move card to active area
            document.getElementById('active-card').innerHTML = document.getElementById('preview-card').innerHTML;
            
            setupSideBoard();
            startCallingLoop();
        }

        function setupSideBoard() {
            const sb = document.getElementById('side-board');
            for(let i=0; i<5; i++){
                let col = document.createElement('div');
                col.className = 'board-col';
                let head = document.createElement('div');
                head.className = 'b-head'; head.innerText = letters[i];
                col.appendChild(head);
                
                for(let n=ranges[i][0]; n<=ranges[i][1]; n++){
                    let numDiv = document.createElement('div');
                    numDiv.className = 'b-num'; numDiv.id = `sb-${n}`; numDiv.innerText = n;
                    col.appendChild(numDiv);
                }
                sb.appendChild(col);
            }
        }

        function startCallingLoop() {
            let pool = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let idx = 0;
            
            let gameLoop = setInterval(() => {
                if(idx >= pool.length) { clearInterval(gameLoop); return; }
                
                let n = pool[idx];
                let l = letters[Math.floor((n-1)/15)];
                
                // Update UI
                document.getElementById('call-l').innerText = l;
                document.getElementById('call-n').innerText = n;
                
                // Mark Side Board
                let sbItem = document.getElementById(`sb-${n}`);
                if(sbItem) sbItem.classList.add('b-called');
                
                // Auto Mark User Card
                document.querySelectorAll('#active-card .cell').forEach(cell => {
                    if(cell.dataset.val == n) cell.classList.add('marked');
                });
                
                idx++;
            }, 3500); // Call every 3.5 seconds
        }
    </script>
</body>
</html>
