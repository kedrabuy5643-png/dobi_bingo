<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Fix</title>
    <style>
        body { font-family: sans-serif; background: #1a0b38; color: white; margin: 0; padding: 0; text-align: center; }
        .header { display: flex; justify-content: space-around; align-items: center; background: #120826; padding: 10px; border-bottom: 1px solid #444; position: sticky; top: 0; }
        .wallet-box { font-size: 10px; color: #bbb; }
        .wallet-box b { display: block; color: #f39c12; font-size: 14px; }
        .timer { background: black; color: #f39c12; border: 1px solid #f39c12; padding: 5px 10px; border-radius: 5px; font-weight: bold; min-width: 60px; }
        
        /* Grid */
        #selection-view { padding: 10px; }
        .num-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; border: 1px solid #333; }
        .n-btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 4px; font-weight: bold; }
        .n-btn.active { background: #f39c12 !important; border: 2px solid white; }

        /* Card */
        .bingo-card { background: #2d1b5a; padding: 15px; border-radius: 15px; display: inline-block; margin-top: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .b-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .cell { background: white; color: black; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 5px; font-size: 14px; }
        .marked { background: #2ecc71 !important; color: white; }

        /* Game */
        #game-view { display: none; grid-template-columns: 100px 1fr; height: 100vh; }
        .side { background: #111; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; font-size: 9px; }
        .s-num { padding: 5px 0; border-bottom: 1px solid #222; color: #666; }
        .s-num.hit { background: #f39c12; color: white; }
        .play-area { padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .ball { width: 70px; height: 70px; border-radius: 50%; background: white; color: black; border: 4px solid #f39c12; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body onload="startApp()">

    <div class="header">
        <div class="wallet-box">Main Wallet<b id="mw">0.00</b></div>
        <div class="wallet-box">Play Wallet<b id="pw">0.00</b></div>
        <div class="timer" id="timer">30 s</div>
    </div>

    <div id="selection-view">
        <h4 style="color:#f39c12; margin: 10px 0;">ቁጥር ይምረጡ (1-200)</h4>
        <div class="num-grid" id="grid"></div>
        
        <p style="margin: 15px 0 5px 0;">የእርስዎ ካርቴላ</p>
        <div class="bingo-card">
            <div class="b-grid" id="preview-card"></div>
        </div>
    </div>

    <div id="game-view">
        <div class="side" id="side-board"></div>
        <div class="play-area">
            <div class="ball" id="current-ball">--</div>
            <div class="bingo-card">
                <div class="b-grid" id="game-card"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B','I','N','G','O'];
        const ranges = [,,,,];

        function startApp() {
            // ቁጥሮችን መፍጠር
            const grid = document.getElementById('grid');
            for(let i=1; i<=200; i++) {
                let b = document.createElement('button');
                b.className = 'n-btn';
                b.innerText = i;
                b.onclick = () => {
                    document.querySelectorAll('.n-btn').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                };
                grid.appendChild(b);
            }

            // ካርቴላ መፍጠር
            const pCard = document.getElementById('preview-card');
            for(let i=0; i<25; i++) {
                let c = document.createElement('div');
                c.className = 'cell';
                let val = (i === 12) ? "FREE" : Math.floor(Math.random() * 75) + 1;
                c.innerText = val;
                c.dataset.v = val;
                pCard.appendChild(c);
            }

            // ታይመሩን ወዲያው ማስጀመር
            let time = 30;
            let tEl = document.getElementById('timer');
            let cd = setInterval(() => {
                time--;
                tEl.innerText = time + " s";
                if(time <= 0) {
                    clearInterval(cd);
                    runGame();
                }
            }, 1000);
        }

        function runGame() {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'grid';
            document.getElementById('game-card').innerHTML = document.getElementById('preview-card').innerHTML;

            const sb = document.getElementById('side-board');
            for(let i=1; i<=75; i++) {
                let n = document.createElement('div');
                n.className = 's-num'; n.innerText = i; n.id = 's'+i;
                sb.appendChild(n);
            }

            let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let idx = 0;
            let loop = setInterval(() => {
                if(idx >= nums.length) { clearInterval(loop); return; }
                let n = nums[idx];
                document.getElementById('current-ball').innerText = n;
                let sCell = document.getElementById('s'+n);
                if(sCell) sCell.classList.add('hit');
                document.querySelectorAll('#game-card .cell').forEach(c => {
                    if(c.dataset.v == n) c.classList.add('marked');
                });
                idx++;
            }, 3000);
        }
    </script>
</body>
</html>
