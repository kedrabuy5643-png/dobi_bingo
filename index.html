<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Final</title>
    <style>
        body { font-family: sans-serif; background: #1a0b38; color: white; margin: 0; text-align: center; }
        .header { display: flex; justify-content: space-around; background: #120826; padding: 10px; border-bottom: 1px solid #444; position: sticky; top: 0; }
        .stat { font-size: 10px; color: #bbb; }
        .stat b { display: block; color: #f39c12; font-size: 14px; }
        .timer-box { background: black; color: #f39c12; border: 1px solid #f39c12; padding: 5px 15px; border-radius: 5px; font-weight: bold; }
        
        /* Selection Grid */
        #selection-screen { padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-height: 350px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px; }
        .btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn.active { background: #f39c12 !important; border: 2px solid white; }

        /* Game Screen */
        #game-screen { display: none; padding: 10px; }
        .bingo-card { background: #2d1b5a; padding: 15px; border-radius: 15px; display: inline-block; margin-top: 20px; }
        .b-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .cell { background: white; color: black; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 5px; }
        .called { background: #2ecc71 !important; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat">Stake<b id="stake">10</b></div>
        <div class="timer-box" id="timer">30 s</div>
    </div>

    <div id="selection-screen">
        <h3 style="color:#f39c12">ቁጥር ይምረጡ (1-200)</h3>
        <div class="grid" id="grid"></div>
        <p id="status-text" style="margin-top:20px; color:#bbb">ቁጥር ሲነኩ ታይመሩ ይጀምራል...</p>
    </div>

    <div id="game-screen">
        <h2 style="color:#2ecc71">ጨዋታው ተጀምሯል!</h2>
        <div class="bingo-card">
            <div class="b-grid" id="card"></div>
        </div>
    </div>

    <script>
        // 1. ቁጥሮቹን መፍጠር
        const grid = document.getElementById('grid');
        for(let i=1; i<=200; i++) {
            let b = document.createElement('button');
            b.className = 'btn';
            b.innerText = i;
            b.onclick = () => startBingo(i, b);
            grid.appendChild(b);
        }

        function startBingo(num, element) {
            // ሁሉንም በተን አጥፍቶ የተነካውን ማድመቅ
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('status-text').innerText = "ቁጥር " + num + " ተመርጧል። ቆጠራው እያለቀ ነው...";

            // ታይመሩን ማስጀመር
            let timeLeft = 30;
            let timerEl = document.getElementById('timer');
            
            let countdown = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft + " s";
                
                if(timeLeft <= 0) {
                    clearInterval(countdown);
                    showGame();
                }
            }, 1000);
        }

        function showGame() {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            // ካርቴላ መፍጠር
            const cardEl = document.getElementById('card');
            for(let i=0; i<25; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = (i === 12) ? "FREE" : Math.floor(Math.random() * 75) + 1;
                cardEl.appendChild(cell);
            }
        }
    </script>
</body>
</html>
