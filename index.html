<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Ultimate</title>
    <style>
        :root { --main-bg: #1a0b38; --card-bg: #2d1b5a; --accent: #f39c12; --win: #2ecc71; --blue: #3498db; --header-bg: #120826; }
        body { font-family: sans-serif; background: var(--main-bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Header (Image 1000013572.jpg) */
        .top-header { display: grid; grid-template-columns: repeat(3, 1fr) 70px; gap: 5px; padding: 10px; background: var(--header-bg); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat-box { background: rgba(255,255,255,0.05); padding: 5px; border-radius: 5px; text-align: center; font-size: 11px; color: #bbb; border: 0.5px solid rgba(255,255,255,0.1); }
        .stat-box span { display: block; font-weight: bold; color: var(--accent); font-size: 14px; margin-top: 2px; }
        .timer-box { background: #000; color: var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 1px solid var(--accent); }

        /* Selection Screen */
        #selection-view { flex: 1; padding: 15px; text-align: center; overflow-y: auto; }
        .scroll-container { 
            max-height: 350px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.3); 
            padding: 10px; 
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin: 0 auto;
            max-width: 350px;
        }
        .num-btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .num-btn.selected { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

        /* Game Screen Layout */
        #game-view { display: none; height: 100%; grid-template-columns: 110px 1fr; }
        .side-board { background: rgba(0,0,0,0.5); border-right: 1px solid #444; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; padding: 2px; }
        .board-col { display: flex; flex-direction: column; gap: 1px; }
        .b-head { background: var(--blue); text-align: center; font-size: 10px; font-weight: bold; padding: 6px 0; }
        .b-num { background: #222; font-size: 9px; text-align: center; padding: 5px 0; color: #888; }
        .b-called { background: var(--accent) !important; color: white; }

        .play-area { padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .caller-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--accent); background: white; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 20px; }
        
        .bingo-card-box { background: var(--card-bg); padding: 15px 10px; border-radius: 15px; width: 90%; max-width: 280px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; margin-bottom: 5px; color: var(--blue); font-size: 18px; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: white; color: black; text-align: center; padding: 12px 0; font-weight: bold; border-radius: 4px; font-size: 14px; }
        .marked { background: var(--win) !important; color: white; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="stat-box">Main Wallet <span id="main-wallet">0.00</span></div>
        <div class="stat-box">Play Wallet <span id="play-wallet">0.00</span></div>
        <div class="stat-box">Stake <span id="stake-amount">10</span></div>
        <div class="timer-box" id="top-timer">30 s</div>
    </div>

    <div id="selection-view">
        <h4 style="margin: 10px 0; color: #ccc;">ቁጥር ይምረጡ (1-200)</h4>
        <div class="scroll-container" id="grid-200"></div>
        
        <div id="preview-area" class="hidden" style="margin-top: 20px;">
            <p style="color:var(--accent); font-weight:bold;">ጨዋታው በቅርቡ ይጀምራል...</p>
            <div class="bingo-card-box" style="margin: 0 auto;">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="preview-card"></div>
            </div>
        </div>
    </div>

    <div id="game-view">
        <div class="side-board" id="side-board"></div>
        <div class="play-area">
            <div class="caller-circle">
                <span id="call-l" style="font-size:14px">READY</span>
                <span id="call-n" style="font-size:24px">--</span>
            </div>
            <div class="bingo-card-box">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="active-card"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B', 'I', 'N', 'G', 'O'];
        const ranges = [,,,,];
        let timerRunning = false;

        // Populate 1-200 Grid
        const grid = document.getElementById('grid-200');
        for(let i=1; i<=200; i++) {
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = () => {
                if(timerRunning) return;
                document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                document.getElementById('preview-area').classList.remove('hidden');
                generateCard('preview-card');
                startGlobalTimer(30);
            };
            grid.appendChild(btn);
        }

        function generateCard(id) {
            const container = document.getElementById(id);
            container.innerHTML = "";
            let cols = [];
            for(let i=0; i<5; i++) {
                let c = [];
                while(c.length < 5) {
                    let r = Math.floor(Math.random()*(ranges[i]-ranges[i]+1))+ranges[i];
                    if(!c.includes(r)) c.push(r);
                }
                cols.push(c);
            }
            for(let r=0; r<5; r++){
                for(let c=0; c<5; c++){
                    let v = (r===2 && c===2) ? "FREE" : cols[c][r];
                    let cell = document.createElement('div');
                    cell.className = 'cell'; cell.innerText = v; cell.dataset.val = v;
                    container.appendChild(cell);
                }
            }
        }

        function startGlobalTimer(sec) {
            timerRunning = true;
            let left = sec;
            const display = document.getElementById('top-timer');
            let countdown = setInterval(() => {
                left--;
                display.innerText = `${left} s`;
                if(left <= 0) {
                    clearInterval(countdown);
                    timerRunning = false;
                    launchGame();
                }
            }, 1000);
        }

        function launchGame() {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'grid';
            document.getElementById('active-card').innerHTML = document.getElementById('preview-card').innerHTML;
            setupSideBoard();
            startCalling();
        }

        function setupSideBoard() {
            const sb = document.getElementById('side-board');
            for(let i=0; i<5; i++) {
                let col = document.createElement('div'); col.className = 'board-col';
                let h = document.createElement('div'); h.className = 'b-head'; h.innerText = letters[i];
                col.appendChild(h);
                for(let n=ranges[i]; n<=ranges[i]; n++){
                    let d = document.createElement('div'); d.className = 'b-num'; d.id = `sb-${n}`; d.innerText = n;
                    col.appendChild(d);
                }
                sb.appendChild(col);
            }
        }

        function startCalling() {
            let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let i = 0;
            let loop = setInterval(() => {
                if(i >= nums.length) { clearInterval(loop); return; }
                let n = nums[i];
                let l = letters[Math.floor((n-1)/15)];
                document.getElementById('call-l').innerText = l;
                document.getElementById('call-n').innerText = n;
                let sbItem = document.getElementById(`sb-${n}`);
                if(sbItem) sbItem.classList.add('b-called');
                document.querySelectorAll('#active-card .cell').forEach(c => {
                    if(c.dataset.val == n) c.classList.add('marked');
                });
                i++;
            }, 3000);
        }
    </script>
</body>
</html>
