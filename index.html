<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo</title>
    <style>
        :root { --bg-color: #1a0b38; --card-bg: #2d1b5a; --accent: #f39c12; --text-color: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(180deg, #2d1b5a 0%, #1a0b38 100%); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Header */
        .header-stats { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 5px; padding: 10px; background: rgba(0,0,0,0.2); }
        .stat-box { background: rgba(255,255,255,0.1); padding: 5px; border-radius: 5px; text-align: center; font-size: 12px; }
        .stat-box span { display: block; font-weight: bold; color: var(--accent); }
        .timer-badge { background: #000; color: var(--accent); padding: 5px 10px; border-radius: 5px; font-weight: bold; display: flex; align-items: center; }

        /* Main Content */
        .main-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; align-items: center; }

        /* Number Grid (Selection) */
        .selection-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; width: 100%; max-width: 400px; }
        .num-btn { background: #e64a19; color: white; border: none; padding: 10px 2px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }

        /* Watching Only Screen */
        .watching-only { text-align: center; margin-top: 50px; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); width: 80%; }
        .watching-only h2 { color: var(--accent); margin-bottom: 20px; }

        /* Bottom Nav */
        .bottom-nav { display: grid; grid-template-columns: repeat(4, 1fr); background: #120826; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { text-align: center; font-size: 12px; color: #888; cursor: pointer; }
        .nav-item.active { color: white; }
        .nav-icon { display: block; font-size: 20px; margin-bottom: 2px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-stats">
        <div class="stat-box">Main Wallet <span id="main-wallet">0</span></div>
        <div class="stat-box">Play Wallet <span id="play-wallet">0</span></div>
        <div class="stat-box">Stake <span id="stake-val">10</span></div>
        <div class="timer-badge" id="timer">25 s</div>
    </div>

    <!-- Main Content -->
    <div class="main-container" id="content-area">
        <!-- ይህ ክፍል ቁጥሮችን ያሳያል -->
        <div id="selection-screen" class="selection-grid">
            <!-- ቁጥሮች በ JS ይፈጠራሉ -->
        </div>

        <!-- ጨዋታው ከተጀመረ ይህ ይታያል -->
        <div id="watching-screen" class="watching-only hidden">
            <h2>Watching Only</h2>
            <p>የዚህ ዙር ጨዋታ ተጀምሯል። አዲስ ዙር እስኪጀመር እዚህ ይጠብቁ።</p>
            <button onclick="location.reload()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:5px; color:white; margin-top:20px;">Refresh</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🎮</span>Game</div>
        <div class="nav-item"><span class="nav-icon">🕒</span>History</div>
        <div class="nav-item"><span class="nav-icon">💰</span>Wallet</div>
        <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>

    <script>
        const selectionScreen = document.getElementById('selection-screen');
        const watchingScreen = document.getElementById('watching-screen');
        const timerDisplay = document.getElementById('timer');

        // 1. የቁጥር ሰሌዳ መፍጠር (1-96 በምስሉ መሰረት)
        for (let i = 1; i <= 96; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            btn.onclick = () => selectNumber(i);
            selectionScreen.appendChild(btn);
        }

        function selectNumber(n) {
            // ቁጥር ሲመረጥ ወደ Watching Only ይቀይራል (ለሙከራ)
            selectionScreen.classList.add('hidden');
            watchingScreen.classList.remove('hidden');
            startTimer(25);
        }

        // 2. የኋሊት ቆጠራ
        function startTimer(seconds) {
            let timeLeft = seconds;
            let countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `${timeLeft} s`;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.innerText = "0 s";
                }
            }, 1000);
        }

        // መጀመሪያውኑ ቆጠራውን ጀምር
        startTimer(25);
    </script>
</body>
</html>
