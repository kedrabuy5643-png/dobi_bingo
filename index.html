<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nikel Bingo App</title>
    <style>
        :root { --bg: #1a0b38; --card: #2d1b5a; --orange: #f39c12; --green: #2ecc71; --blue: #3498db; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Header */
        .header { display: grid; grid-template-columns: repeat(3, 1fr) 80px; gap: 4px; padding: 10px; background: #120826; border-bottom: 1px solid #444; }
        .stat { background: rgba(255,255,255,0.05); padding: 5px; border-radius: 5px; text-align: center; font-size: 10px; }
        .stat span { display: block; color: var(--orange); font-weight: bold; font-size: 12px; }
        .timer { background: #000; color: var(--orange); border: 1px solid var(--orange); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Selection */
        #selection-screen { flex: 1; overflow-y: auto; padding: 10px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-height: 280px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid #444; }
        .num-btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; outline: none; }
        .num-btn:active { background: var(--orange); }
        .active { background: var(--orange) !important; border: 2px solid white !important; }

        /* Preview */
        #card-preview { display: none; margin-top: 15px; padding-bottom: 40px; }
        .bingo-box { background: var(--card); padding: 15px 10px; border-radius: 15px; width: 280px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .b-header { display: grid; grid-template-columns: repeat(5, 1fr); color: var(--blue); font-weight: bold; font-size: 18px; margin-bottom: 8px; }
        .b-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: white; color: black; padding: 12px 0; font-weight: bold; border-radius: 4px; text-align: center; font-size: 14px; }
        .marked { background: var(--green) !important; color: white; }

        /* Game */
        #game-screen { display: none; height: 100%; grid-template-columns: 110px 1fr; }
        .side-board { background: rgba(0,0,0,0.5); border-right: 1px solid #444; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; }
        .col { display: flex; flex-direction: column; }
        .h { background: var(--blue); text-align: center; font-size: 10px; padding: 6px 0; font-weight: bold; }
        .n { background: #222; text-align: center; font-size: 9px; padding: 5px 0; color: #888; border-bottom: 1px solid #111; }
        .called { background: var(--orange) !important; color: white; }
        .main-play { padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .caller { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--orange); background: white; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat">Main Wallet<span id="mw">0.00</span></div>
        <div class="stat">Play Wallet<span id="pw">0.00</span></div>
        <div class="stat">Stake<span id="st">10</span></div>
        <div class="timer" id="timer-text">30 s</div>
    </div>

    <div id="selection-screen">
        <h4 style="margin: 10px 0; color: var(--orange);">ቁጥር ይምረጡ (1-200)</h4>
        <div class="grid" id="main-grid"></div>
        <div id="card-preview">
            <p style="font-size:14px; margin-bottom:10px;">የመረጡት ካርቴላ</p>
            <div class="bingo-box">
                <div class="b-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="b-grid" id="p-grid"></div>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <div class="side-board" id="sb"></div>
        <div class="main-play">
            <div class="caller"><span id="cL" style="font-size:10px">READY</span><span id="cN" style="font-size:20px">--</span></div>
            <div class="bingo-box">
                <div class="b-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="b-grid" id="g-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B','I','N','G','O'];
        const ranges = [,,,,];
        let timerStarted = false;

        // 1. ግሪዱን መሙላት
        const gridBox = document.getElementById('main-grid');
        let btnsHtml = '';
        for(let i=1; i<=200; i++) {
            btnsHtml += `<button class="num-btn" id="nb-${i}" onclick="handleClick(${i})">${i}</button>`;
        }
        gridBox.innerHTML = btnsHtml;

        // 2. ክሊክ ሲደረግ
        function handleClick(n) {
            if(timerStarted) return;
            
            // በተኑን አክቲቭ ማድረግ
            const all = document.querySelectorAll('.num-btn');
            all.forEach(b => b.classList.remove('active'));
            document.getElementById('nb-'+n).classList.add('active');

            // ካርቴላ ማሳየት
            document.getElementById('card-preview').style.display = 'block';
            createCard('p-grid');

            // ታይመር መጀመር
            timerStarted = true;
            let time = 30;
            const tDisp = document.getElementById('timer-text');
            const cd = setInterval(() => {
                time--;
                tDisp.innerText = time + " s";
                if(time <= 0) {
                    clearInterval(cd);
                    startGame();
                }
            }, 1000);

            // ስክሮል ወደ ታች
            setTimeout(() => { window.scrollTo({top: 500, behavior: 'smooth'}); }, 100);
        }

        function createCard(id) {
            const container = document.getElementById(id);
            container.innerHTML = "";
            let cols = [];
            for(let i=0; i<5; i++){
                let c = [];
                while(c.length<5){
                    let r = Math.floor(Math.random()*(ranges[i]-ranges[i]+1))+ranges[i];
                    if(!c.includes(r)) c.push(r);
                }
                cols.push(c);
            }
            for(let r=0; r<5; r++){
                for(let c=0; c<5; c++){
                    let v = (r===2 && c===2) ? "FREE" : cols[c][r];
                    let div = document.createElement('div');
                    div.className = 'cell'; div.innerText = v; div.dataset.v = v;
                    container.appendChild(div);
                }
            }
        }

        function startGame() {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'grid';
            document.getElementById('g-grid').innerHTML = document.getElementById('p-grid').innerHTML;
            
            const sBox = document.getElementById('sb');
            let sHtml = "";
            for(let i=0; i<5; i++){
                sHtml += `<div class="col"><div class="h">${letters[i]}</div>`;
                for(let n=ranges[i]; n<=ranges[i]; n++){
                    sHtml += `<div class="n" id="s-${n}">${n}</div>`;
                }
                sHtml += `</div>`;
            }
            sBox.innerHTML = sHtml;
            runBingo();
        }

        function runBingo() {
            let nums = Array.from({length:75},(_,i)=>i+1).sort(()=>Math.random()-0.5);
            let idx = 0;
            const loop = setInterval(() => {
                if(idx >= nums.length) { clearInterval(loop); return; }
                let n = nums[idx];
                let l = letters[Math.floor((n-1)/15)];
                document.getElementById('cL').innerText = l;
                document.getElementById('cN').innerText = n;
                let sCell = document.getElementById('s-'+n);
                if(sCell) sCell.classList.add('called');
                document.querySelectorAll('#g-grid .cell').forEach(c => {
                    if(c.dataset.v == n) c.classList.add('marked');
                });
                idx++;
            }, 3000);
        }
    </script>
</body>
</html>
