<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        /* የቁጥሮች መደርደሪያ (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .number-btn {
            padding: 15px;
            background: #333;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .number-btn:hover { background: #555; }
        .number-btn:active { background: #007bff; }

        /* የካርቴላ ማሳያ ስክሪን */
        #preview-screen {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        #timer-display {
            font-size: 24px;
            color: #ff4d4d;
            font-weight: bold;
            margin-top: 20px;
        }

        /* ዋናው ጨዋታ (ለጊዜው የተደበቀ) */
        #game-screen {
            padding: 50px;
            font-size: 28px;
        }
    </style>
</head>
<body>

    <!-- 1. የቁጥር መምረጫ ስክሪን -->
    <div id="selection-screen">
        <h2>ቁጥር ይምረጡ (1-200)</h2>
        <div id="number-grid" class="grid-container">
            <!-- ቁጥሮቹ በJS እዚህ ይፈጠራሉ -->
        </div>
    </div>

    <!-- 2. የካርቴላ ቅድመ-ዕይታ እና ታይመር -->
    <div id="preview-screen" style="display:none;">
        <h2>የተመረጠ ካርቴላ ቁጥር: <span id="selected-no" style="color:#007bff;"></span></h2>
        <div id="cartela-box" style="border: 2px solid #555; padding: 20px; margin: 20px 0;">
            <p>🖼 ካርቴላ ቁጥር <span id="cartela-id-text"></span> እዚህ ጋር ይታያል</p>
            <!-- እዚህ ጋር ምስል ማስገባት ትችላለህ: <img id="cartela-img" src="" style="width:100%"> -->
        </div>
        <div id="timer-display">ጨዋታው በ <span id="seconds">30</span> ሰከንድ ይጀምራል...</div>
    </div>

    <!-- 3. ዋናው የጨዋታ ስክሪን -->
    <div id="game-screen" style="display:none;">
        <h1>🎰 ጨዋታው ተጀምሯል! 🎰</h1>
        <p>መልካም ዕድል!</p>
        <!-- ያንተ የቢንጎ ጨዋታ logic እዚህ ይገባል -->
    </div>

    <script>
        // ቁጥሮቹን ከ1 እስከ 200 መፍጠር
        const grid = document.getElementById('number-grid');
        for (let i = 1; i <= 200; i++) {
            let btn = document.createElement('div');
            btn.className = 'number-btn';
            btn.innerText = i;
            btn.onclick = () => selectCartela(i);
            grid.appendChild(btn);
        }

        function selectCartela(num) {
            // መምረጫውን ደብቆ ማሳያውን ማምጣት
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('preview-screen').style.display = 'block';
            document.getElementById('selected-no').innerText = num;
            document.getElementById('cartela-id-text').innerText = num;

            // የ30 ሰከንድ ቆጠራ
            let timeLeft = 30;
            const timerSpan = document.getElementById('seconds');
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerSpan.innerText = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    startGame();
                }
            }, 1000);
        }

        function startGame() {
            document.getElementById('preview-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
        }
    </script>

</body>
</html>
