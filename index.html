<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo Pro Fix</title>
    <style>
        :root { --main-bg: #1a0b38; --card-bg: #2d1b5a; --accent: #f39c12; --win: #2ecc71; --blue: #3498db; --header-bg: #120826; }
        body { font-family: sans-serif; background: var(--main-bg); color: white; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Top Header */
        .top-header { display: grid; grid-template-columns: repeat(3, 1fr) 75px; gap: 5px; padding: 10px; background: var(--header-bg); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat-box { background: rgba(255,255,255,0.05); padding: 5px; border-radius: 5px; text-align: center; font-size: 10px; color: #bbb; border: 0.5px solid rgba(255,255,255,0.1); }
        .stat-box span { display: block; font-weight: bold; color: var(--accent); font-size: 13px; margin-top: 2px; }
        .timer-box { background: #000; color: var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 1px solid var(--accent); }

        /* Selection View */
        #selection-view { flex: 1; padding: 10px; text-align: center; overflow-y: auto; }
        .scroll-container { 
            max-height: 300px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.3); 
            padding: 10px; 
            border-radius: 10px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin: 10px auto;
            max-width: 360px;
        }
        .num-btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .num-btn.selected { background: var(--accent); transform: scale(1.05); border: 1px solid white; }

        /* Card Area */
        #prep-area { margin-top: 15px; display: none; }
        .bingo-card-box { background: var(--card-bg); padding: 15px 10px; border-radius: 15px; width: 90%; max-width: 280px; margin: 0 auto; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; font-weight: bold; margin-bottom: 5px; color: var(--blue); font-size: 18px; }
        .card-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: white; color: black; text-align: center; padding: 12px 0; font-weight: bold; border-radius: 4px; font-size: 14px; border-bottom: 2px solid #ccc; }
        .marked { background: var(--win) !important; color: white; border-bottom: none; }

        /* Game Screen */
        #game-view { display: none; height: 100%; grid-template-columns: 115px 1fr; }
        .side-board { background: rgba(0,0,0,0.5); border-right: 1px solid #444; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; padding: 2px; }
        .board-col { display: flex; flex-direction: column; gap: 1px; }
        .b-head { background: var(--blue); text-align: center; font-size: 10px; font-weight: bold; padding: 6px 0; }
        .b-num { background: #222; font-size: 9px; text-align: center; padding: 5px 0; color: #888; border-radius: 1px; }
        .b-called { background: var(--accent) !important; color: white; font-weight: bold; }

        .play-area { padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .caller-circle { width: 75px; height: 75px; border-radius: 50%; border: 4px solid var(--accent); background: white; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 20px; box-shadow: 0 0 10px rgba(243, 156, 18, 0.5); }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="stat-box">Main Wallet <span id="main-wallet">0.00</span></div>
        <div class="stat-box">Play Wallet <span id="play-wallet">0.00</span></div>
        <div class="stat-box">Stake <span id="stake-amount">10</span></div>
        <div class="timer-box" id="top-timer">30 s</div>
    </div>

    <div id="selection-view">
        <h4 style="margin: 5px 0; color: var(--accent);">ቁጥር ይምረጡ (1-200)</h4>
        <div class="scroll-container" id="grid-200"></div>
        
        <div id="prep-area">
            <p style="color:white; font-size: 14px; margin-bottom: 10px;">የእርስዎ ካርቴላ</p>
            <div class="bingo-card-box">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="preview-card"></div>
            </div>
        </div>
    </div>

    <div id="game-view">
        <div class="side-board" id="side-board"></div>
        <div class="play-area">
            <div class="caller-circle">
                <span id="call-l" style="font-size:12px">READY</span>
                <span id="call-n" style="font-size:22px">--</span>
            </div>
            <div class="bingo-card-box">
                <div class="bingo-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="card-grid" id="active-card"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B', 'I', 'N', 'G', 'O'];
        const ranges = [,,,,];
        let gameActive = false;

        // 1-200 ቁጥሮችን መፍጠር
        const grid = document.getElementById('grid-200');
        for(let i=1; i<=200; i++) {
            let btn = document.createElement('button');
            btn.className = 'num-btn';
            btn.innerText = i;
            btn.onclick = function() {
                if(gameActive) return;
                
                // ቁጥሩን መምረጥ
                document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                
                // ካርቴላውን ወዲያውኑ ማሳየት
                document.getElementById('prep-area').style.display = 'block';
                generateCard('preview-card');
                
                // ታይመሩን ማስጀመር
                startTimer(30);
                gameActive = true;
            };
            grid.appendChild(btn);
        }

        function generateCard(id) {
            const container = document.getElementById(id);
            container.innerHTML = "";
            let cols = [];
            for(let i=0; i<5; i++) {
                let c = [];
                while(c.length < 5) {
                    let r = Math.floor(Math.random()*(ranges[i]-ranges[i]+1))+ranges[i];
                    if(!c.includes(r)) c.push(r);
                }
                cols.push(c);
            }
            for(let r=0; r<5; r++){
                for(let c=0; c<5; c++){
                    let v = (r===2 && c===2) ? "FREE" : cols[c][r];
                    let cell = document.createElement('div');
                    cell.className = 'cell'; 
                    cell.innerText = v; 
                    cell.dataset.val = v;
                    container.appendChild(cell);
                }
            }
        }

        function startTimer(sec) {
            let timeLeft = sec;
            const display = document.getElementById('top-timer');
            let countdown = setInterval(() => {
                timeLeft--;
                display.innerText = timeLeft + " s";
                if(timeLeft <= 0) {
                    clearInterval(countdown);
                    launchGame();
                }
            }, 1000);
        }

        function launchGame() {
            document.getElementById('selection-view').style.display = 'none';
            document.getElementById('game-view').style.display = 'grid';
            
            // የተመረጠውን ካርቴላ ወደ ጨዋታው ማዛወር
            document.getElementById('active-card').innerHTML = document.getElementById('preview-card').innerHTML;
            
            setupSideBoard();
            startCalling();
        }

        function setupSideBoard() {
            const sb = document.getElementById('side-board');
            sb.innerHTML = ""; // Clear board
            for(let i=0; i<5; i++) {
                let col = document.createElement('div'); 
                col.className = 'board-col';
                let h = document.createElement('div'); 
                h.className = 'b-head'; 
                h.innerText = letters[i];
                col.appendChild(h);
                
                for(let n=ranges[i]; n<=ranges[i]; n++){
                    let d = document.createElement('div'); 
                    d.className = 'b-num'; 
                    d.id = `sb-${n}`; 
                    d.innerText = n;
                    col.appendChild(d);
                }
                sb.appendChild(col);
            }
        }

        function startCalling() {
            let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let idx = 0;
            let loop = setInterval(() => {
                if(idx >= nums.length) { clearInterval(loop); return; }
                
                let n = nums[idx];
                let l = letters[Math.floor((n-1)/15)];
                
                // ቁጥሩን ማሳየት
                document.getElementById('call-l').innerText = l;
                document.getElementById('call-n').innerText = n;
                
                // የጎን ቦርድ ላይ ምልክት ማድረግ
                let sbItem = document.getElementById(`sb-${n}`);
                if(sbItem) sbItem.classList.add('b-called');
                
                // ካርቴላው ላይ ካለ Auto-Mark ማድረግ
                document.querySelectorAll('#active-card .cell').forEach(c => {
                    if(c.dataset.val == n) c.classList.add('marked');
                });
                
                idx++;
            }, 3000);
        }
    </script>
</body>
</html>
