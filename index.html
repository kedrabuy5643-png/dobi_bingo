<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nikel Bingo App</title>
    <style>
        :root { --bg: #1a0b38; --card: #2d1b5a; --orange: #f39c12; --green: #2ecc71; --blue: #3498db; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header */
        .header { display: grid; grid-template-columns: repeat(3, 1fr) 80px; gap: 4px; padding: 10px; background: #120826; border-bottom: 1px solid #444; flex-shrink: 0; }
        .stat { background: rgba(255,255,255,0.05); padding: 5px; border-radius: 5px; text-align: center; font-size: 10px; }
        .stat span { display: block; color: var(--orange); font-weight: bold; font-size: 12px; }
        .timer { background: #000; color: var(--orange); border: 1px solid var(--orange); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* Selection Area */
        #selection-screen { flex: 1; overflow-y: auto; padding: 10px; text-align: center; display: block; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-height: 280px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; }
        .num-btn { background: #e64a19; color: white; border: none; padding: 12px 0; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .num-btn.active { background: var(--orange) !important; border: 2px solid white; box-shadow: 0 0 10px var(--orange); }

        /* Card Preview */
        #card-preview { display: none; margin-top: 10px; padding-bottom: 50px; }
        .bingo-box { background: var(--card); padding: 15px 10px; border-radius: 15px; width: 100%; max-width: 280px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .b-header { display: grid; grid-template-columns: repeat(5, 1fr); color: var(--blue); font-weight: bold; font-size: 18px; margin-bottom: 8px; }
        .b-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .cell { background: white; color: black; padding: 12px 0; font-weight: bold; border-radius: 4px; text-align: center; font-size: 14px; }
        .marked { background: var(--green) !important; color: white; }

        /* Game Screen */
        #game-screen { display: none; height: 100%; grid-template-columns: 110px 1fr; }
        .side-board { background: rgba(0,0,0,0.5); border-right: 1px solid #444; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; }
        .col { display: flex; flex-direction: column; }
        .h { background: var(--blue); text-align: center; font-size: 10px; padding: 6px 0; font-weight: bold; position: sticky; top: 0; }
        .n { background: #222; text-align: center; font-size: 9px; padding: 5px 0; color: #888; border-bottom: 1px solid #111; }
        .called { background: var(--orange) !important; color: white; font-weight: bold; }
        
        .main-play { padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .caller { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--orange); background: white; color: black; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 20px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="stat">Main Wallet<span id="mw">0.00</span></div>
        <div class="stat">Play Wallet<span id="pw">0.00</span></div>
        <div class="stat">Stake<span id="st">10</span></div>
        <div class="timer" id="timer-text">30 s</div>
    </div>

    <div id="selection-screen">
        <h4 style="margin: 10px 0; color: var(--orange);">ቁጥር ይምረጡ (1-200)</h4>
        <div class="grid" id="main-grid">
            </div>
        
        <div id="card-preview">
            <p style="font-size:14px; margin-bottom:10px; color: white;">የመረጡት ካርቴላ</p>
            <div class="bingo-box">
                <div class="b-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="b-grid" id="p-grid"></div>
            </div>
        </div>
    </div>

    <div id="game-screen">
        <div class="side-board" id="sb"></div>
        <div class="main-play">
            <div class="caller">
                <span id="cL" style="font-size:10px">READY</span>
                <span id="cN" style="font-size:20px">--</span>
            </div>
            <div class="bingo-box">
                <div class="b-header"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
                <div class="b-grid" id="g-grid"></div>
            </div>
        </div>
    </div>

    <script>
        const letters = ['B','I','N','G','O'];
        const ranges = [,,,,];
        let isLocked = false;

        // 1. ቁጥሮችን መፍጠር
        function createGrid() {
            const grid = document.getElementById('main-grid');
            let html = "";
            for(let i=1; i<=200; i++) {
                html += `<button class="num-btn" id="btn-${i}" onclick="selectNum(${i})">${i}</button>`;
            }
            grid.innerHTML = html;
        }

        // 2. ቁጥር ሲመረጥ
        function selectNum(n) {
            if(isLocked) return;
            
            // የነካነውን ቁልፍ ቀለም መቀየር
            const allBtns = document.querySelectorAll('.num-btn');
            allBtns.forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + n).classList.add('active');

            // ካርቴላውን ማሳየት
            document.getElementById('card-preview').style.display = 'block';
            generateBingoData('p-grid');

            // ቆጠራ መጀመር
            isLocked = true;
            let timeLeft = 30;
            const timerDisp = document.getElementById('timer-text');
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerDisp.innerText = timeLeft + " s";
                if(timeLeft <= 0) {
                    clearInterval(countdown);
                    goToGame();
                }
            }, 1000);

            // ወደ ታች ስክሮል አድርግ
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        function generateBingoData(gridId) {
            const gridEl = document.getElementById(gridId);
            gridEl.innerHTML = "";
            let columns = [];
            for(let i=0; i<5; i++){
                let col = [];
                while(col.length < 5){
                    let r = Math.floor(Math.random()*(ranges[i]-ranges[i]+1))+ranges[i];
                    if(!col.includes(r)) col.push(r);
                }
                columns.push(col);
            }
            for(let row=0; row<5; row++){
                for(let col=0; col<5; col++){
                    let val = (row===2 && col===2) ? "FREE" : columns[col][row];
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.innerText = val;
                    cell.dataset.num = val;
                    gridEl.appendChild(cell);
                }
            }
        }

        function goToGame() {
            document.getElementById('selection-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'grid';
            // ካርቴላውን ገልብጥ
            document.getElementById('g-grid').innerHTML = document.getElementById('p-grid').innerHTML;
            
            // የጎን ቦርድ ስራ
            const sb = document.getElementById('sb');
            let sbHtml = "";
            for(let i=0; i<5; i++){
                sbHtml += `<div class="col"><div class="h">${letters[i]}</div>`;
                for(let n=ranges[i]; n<=ranges[i]; n++){
                    sbHtml += `<div class="n" id="side-${n}">${n}</div>`;
                }
                sbHtml += `</div>`;
            }
            sb.innerHTML = sbHtml;

            startCalling();
        }

        function startCalling() {
            let nums = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            let i = 0;
            const loop = setInterval(() => {
                if(i >= nums.length) { clearInterval(loop); return; }
                let n = nums[i];
                let l = letters[Math.floor((n - 1) / 15)];
                
                document.getElementById('cL').innerText = l;
                document.getElementById('cN').innerText = n;
                
                // Side board mark
                let sideCell = document.getElementById('side-' + n);
                if(sideCell) sideCell.classList.add('called');

                // Card mark
                document.querySelectorAll('#g-grid .cell').forEach(c => {
                    if(c.dataset.num == n) c.classList.add('marked');
                });
                
                i++;
            }, 3000);
        }

        // ገጹ ሲከፈት ቁጥሮቹን ፍጠር
        window.onload = createGrid;
    </script>
</body>
</html>
