<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikel Bingo</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 400px; margin: 0 auto; max-height: 400px; overflow-y: auto; padding: 10px; background: #1e1e1e; border-radius: 10px; }
        .num-btn { background: #333; color: white; border: none; padding: 15px; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .num-btn:hover { background: #555; }
        #selection-screen, #game-screen { display: block; }
        #game-screen { display: none; margin-top: 20px; }
        .timer { font-size: 24px; color: #ffcc00; margin: 20px 0; }
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 300px; margin: 0 auto; background: #444; padding: 10px; border-radius: 10px; }
        .card-cell { background: #fff; color: #000; padding: 15px; font-weight: bold; border-radius: 3px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="selection-screen">
        <h2>ቁጥር ይምረጡ (1-200)</h2>
        <div class="number-grid" id="grid"></div>
    </div>

    <div id="game-screen">
        <div class="timer" id="timer-display">ጨዋታው ለመጀመር፡ 30 ሰከንድ</div>
        <h3>የእርስዎ ካርቴላ</h3>
        <div class="bingo-card" id="user-card"></div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const selectionScreen = document.getElementById('selection-screen');
        const gameScreen = document.getElementById('game-screen');
        const timerDisplay = document.getElementById('timer-display');
        const cardDisplay = document.getElementById('user-card');

        // 1. ከ 1-200 ያሉ ቁጥሮችን መፍጠር
        for (let i = 1; i <= 200; i++) {
            let btn = document.createElement('button');
            btn.innerText = i;
            btn.className = 'num-btn';
            btn.onclick = () => selectNumber(i);
            grid.appendChild(btn);
        }

        function selectNumber(num) {
            selectionScreen.classList.add('hidden');
            gameScreen.style.display = 'block';
            
            generateBingoCard();
            startTimer();
        }

        // 2. የቢንጎ ካርቴላ መፍጠር (Random 25 numbers)
        function generateBingoCard() {
            cardDisplay.innerHTML = "";
            let numbers = [];
            while(numbers.length < 25) {
                let r = Math.floor(Math.random() * 75) + 1;
                if(numbers.indexOf(r) === -1) numbers.push(r);
            }
            numbers.forEach(n => {
                let cell = document.createElement('div');
                cell.className = 'card-cell';
                cell.innerText = n;
                cardDisplay.appendChild(cell);
            });
        }

        // 3. የ 30 ሰከንድ ቆጠራ
        function startTimer() {
            let timeLeft = 30;
            let countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `ጨዋታው ለመጀመር፡ ${timeLeft} ሰከንድ`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.innerText = "ጨዋታው ተጀምሯል!";
                    // እዚህ ጋር የቦቱን የጨዋታ Logic መጥራት ትችላለህ
                }
            }, 1000);
        }
    </script>
</body>
</html>
